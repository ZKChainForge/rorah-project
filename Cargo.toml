[workspace]
members = [
    "crates/rorah-core",
    "crates/rorah-utils",
    "crates/rorah-circuits",
    "cli",
    
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["VIKRAM"]
license = "MIT"
repository = "https://github.com/ZKChainForge/rorah-project"

[workspace.dependencies]
# ─── Arkworks (all must be same version) ─────────────────────────────────────
ark-ff          = "0.5.0"
ark-ec          = "0.5.0"
ark-std         = "0.5.0"
ark-bn254       = "0.5.0"
ark-serialize   = "0.5.0"
ark-poly        = "0.5.0"

# ─── Error handling ──────────────────────────────────────────────────────────
thiserror = "1.0.56"
anyhow    = "1.0.79"

# ─── Serialization ───────────────────────────────────────────────────────────
serde      = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
bincode    = "1.3.3"

# ─── Hashing ─────────────────────────────────────────────────────────────────
sha3 = "0.10.8"

# ─── Randomness ──────────────────────────────────────────────────────────────
rand       = "0.8.5"
rand_chacha = "0.3.1"

# ─── Utilities ───────────────────────────────────────────────────────────────
hex    = "0.4.3"
subtle = "2.5.0"

# ─── Async ───────────────────────────────────────────────────────────────────
tokio = { version = "1.35.1", features = ["full"] }

# ─── Development ─────────────────────────────────────────────────────────────
proptest  = "1.4.0"
criterion = { version = "0.5.1", features = ["html_reports"] }

[profile.release]
opt-level       = 3
lto             = "fat"
codegen-units   = 1
panic           = "abort"
overflow-checks = true

[profile.dev]
opt-level       = 1
overflow-checks = true

[profile.bench]
inherits = "release"
debug    = true

[profile.test]
opt-level = 1